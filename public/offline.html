<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#9d174d" />
  <title>Sin conexión | Brenn's Beauty</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #030712; color: #f9fafb; font-family: system-ui, sans-serif; padding: 24px; text-align: center;
    }
    img { width: 96px; height: 96px; border-radius: 50%; margin-bottom: 20px; }
    h1 { font-size: 1.5rem; margin-bottom: 8px; }
    p { color: #f9a8d4; font-size: .95rem; margin-bottom: 24px; line-height: 1.5; }
    a, button {
      display: inline-block; margin: 4px; padding: 12px 20px; border-radius: 14px; border: 0;
      background: #ec4899; color: #fff; font-weight: 700; text-decoration: none; cursor: pointer; font-size: .9rem;
    }
    a.sec { background: transparent; border: 1px solid #9d174d; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="Brenn's Beauty" />
    <h1>Estás sin conexión</h1>
    <p>Esta sección necesita internet (citas, carrito, pagos y tu cuenta).<br />
       Mientras tanto puedes ver las páginas que ya visitaste.</p>
    <button onclick="location.reload()">Reintentar</button>
    <a class="sec" href="/">Inicio</a>
    <a class="sec" href="/catalogo">Catálogo</a>
    <a class="sec" href="/faq">Preguntas frecuentes</a>
  </main>
</body>
</html>
